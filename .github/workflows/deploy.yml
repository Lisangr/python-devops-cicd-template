name: Deploy to Production

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:  # Ручной запуск

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
      
      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install community.docker ansible.posix
      
      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          echo "Host ${{ secrets.SERVER_HOST }}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config
      
      - name: Create inventory file
        run: |
          cat > ansible/inventory.ini << EOF
          [webservers]
          app-server-1 ansible_host=${{ secrets.SERVER_HOST }} ansible_user=${{ secrets.SERVER_USER }} ansible_ssh_common_args='-o StrictHostKeyChecking=no' ansible_ssh_pass='${{ secrets.SERVER_PASS }}'
          EOF
      
      - name: Deploy to server
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml -vvv
