---
- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: docker_check.rc != 0

- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present
  when: docker_check.rc != 0

- name: Remove old Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: absent
  when: docker_check.rc != 0

- name: Add Docker GPG key to keyring
  shell: |
    curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  when: docker_check.rc != 0

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes
  when: docker_check.rc != 0

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  when: docker_check.rc != 0

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
  when: docker_check.rc != 0

- name: Add current user to docker group
  user:
    name: "{{ ansible_facts['user'] }}"
    groups: docker
  when: docker_check.rc != 0

- name: Check if docker-compose is available
  command: docker compose version
  register: docker_compose_check
  failed_when: false
  changed_when: false

- name: Install docker-compose (if not available as plugin)
  pip:
    name: docker-compose
    state: present
  when: 
    - docker_check.rc != 0
    - docker_compose_check.rc != 0
    - ansible_facts['distribution_version'] is version('20.04', '<')